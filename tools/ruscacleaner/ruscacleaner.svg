<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0"    stop-color="#A4508B"/>
      <stop offset="0.4"  stop-color="#7D3C68"/>
      <stop offset="1"    stop-color="#4A1F42"/>
    </linearGradient>
    <linearGradient id="bodyHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#E8AFD4" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#E8AFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0"    stop-color="#FBE9A6"/>
      <stop offset="0.45" stop-color="#E3B23C"/>
      <stop offset="1"    stop-color="#9A6E12"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFF3C4"/>
      <stop offset="1"   stop-color="#C68A1C"/>
    </linearGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"    stop-color="#FBE9A6"/>
      <stop offset="0.55" stop-color="#E3B23C"/>
      <stop offset="1"    stop-color="#A8760F"/>
    </linearGradient>
    <linearGradient id="bgA" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"    stop-color="#6E2050"/>
      <stop offset="0.55" stop-color="#431436"/>
      <stop offset="1"    stop-color="#280A20"/>
    </linearGradient>
    <radialGradient id="bgAglow" cx="0.32" cy="0.26" r="0.8">
      <stop offset="0"   stop-color="#E8AFD4" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#E8AFD4" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#E8AFD4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgA)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgAglow)"/>
  <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="14.4" fill="none"
        stroke="url(#goldB)" stroke-width="1" opacity="0.55"/>

  <g transform="rotate(-42 32 32)">
    <!-- ombra -->
    <g fill="#000000" opacity="0.22" transform="translate(1.8,2.2)">
      <rect x="29" y="7" width="6" height="28" rx="3"/>
      <path d="M26.4 33.5 H37.6 L41.8 55.4 Q42.4 58.2 39.5 58.2 H24.5 Q21.6 58.2 22.2 55.4 Z"/>
    </g>

    <!-- manico -->
    <rect x="29" y="7" width="6" height="28" rx="3" fill="url(#body)"/>
    <rect x="29.9" y="8.6" width="1.7" height="24" rx="0.85" fill="url(#bodyHi)"/>

    <!-- ghiera -->
    <rect x="26.4" y="33.4" width="11.2" height="5.4" rx="1.6" fill="url(#gold)"/>
    <rect x="26.4" y="34" width="11.2" height="1" rx="0.5" fill="#FFF3C4" opacity="0.7"/>
    <rect x="26.4" y="37.6" width="11.2" height="0.9" fill="#8A5E10" opacity="0.6"/>

    <!-- setole -->
    <path d="M26.6 38.6 H37.4 L41.4 55.4 Q42 58.2 39.2 58.2 H24.8 Q22 58.2 22.6 55.4 Z"
          fill="url(#straw)"/>
    <g stroke="#8A5E10" stroke-width="0.85" opacity="0.5" stroke-linecap="round">
      <path d="M28.6 40.5 25.8 56.4"/>
      <path d="M32 40.5 32 56.4"/>
      <path d="M35.4 40.5 38.2 56.4"/>
    </g>
    <path d="M23.4 54.4 H40.6 L41.4 55.4 Q42 58.2 39.2 58.2 H24.8 Q22 58.2 22.6 55.4 Z"
          fill="#8A5E10" opacity="0.25"/>
  </g>
