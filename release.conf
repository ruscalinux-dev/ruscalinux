# ---------------------------------------------------------------------------
# RuscaLinux — single source of truth.
#
# This is the ONLY file where the version is written. It propagates to the
# ISO name, the ISO volume label, /etc/os-release, /etc/issue, the Debian
# Installer title and the GTK installer banner.
#
# To prepare a new version: change VERSION, run ./build.sh, test the image,
# run ./release.sh. That is the whole procedure.
# ---------------------------------------------------------------------------

VERSION="1.99.2"

# --- Debian base ------------------------------------------------------------
SUITE="trixie"
ARCH="amd64"
MIRROR="http://ftp.fr.debian.org/debian/"

KERNEL="6.12"
DESKTOP="GNOME 48"

# --- Bundled packages -------------------------------------------------------
# Version of the icon, wallpaper and font packages built from branding/.
BRANDING_VERSION="1.0"

# --- Strumenti di sistema ---------------------------------------------------
# Le utility in tools/ (RuscaCleaner, RuscaHub, RuscaMark) sono costruite qui,
# non scaricate: dalla 1.99.2 RuscaWriter e vendor/ non ci sono piu'.
# Ognuna ha la sua versione scritta nel proprio make-deb.sh e, come
# APP_VERSION, nel programma: deve coincidere con VERSION qui sopra.
# make-debs.sh avvisa se non coincide. Aggiungerne una e' solo creare una
# directory: make-debs.sh e build.sh le trovano da sole.
