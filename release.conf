# ---------------------------------------------------------------------------
# RuscaLinux — single source of truth.
#
# This is the ONLY file where the version is written. It propagates to the
# ISO name, the ISO volume label, /etc/os-release, /etc/issue, the Debian
# Installer title and the GTK installer banner.
#
# To prepare a new version: change VERSION, run ./build.sh, test the image,
# run ./release.sh. That is the whole procedure.
# ---------------------------------------------------------------------------

VERSION="1.99.1"

# --- Debian base ------------------------------------------------------------
SUITE="trixie"
ARCH="amd64"
MIRROR="http://ftp.fr.debian.org/debian/"

KERNEL="6.12"
DESKTOP="GNOME 48"

# --- Bundled packages -------------------------------------------------------
# RuscaWriter is fetched at build time so the ISO always ships the current
# release. No version number is written here on purpose: make-debs.sh reads
# the real version out of the downloaded package.
#
# By default it asks the GitHub API for the newest release and takes the
# first .deb attached to it, so the asset can be named anything.
RUSCAWRITER_REPO="ruscalinux-dev/ruscawriter"

# Set this to bypass the API and download from a fixed address instead —
# for example a stable link on the website. Leave empty to use the API.
RUSCAWRITER_URL=""

BRANDING_VERSION="1.0"

# --- Strumenti di sistema ---------------------------------------------------
# Le utility in tools/ sono costruite qui, non scaricate. Ognuna dichiara la
# propria versione in tools/<nome>/VERSION, accanto al codice che descrive,
# così aggiungerne una è solo creare una directory: nessun file da modificare
# altrove. make-debs.sh e build.sh le trovano da sole.
