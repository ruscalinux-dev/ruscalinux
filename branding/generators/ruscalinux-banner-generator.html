<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuscaLinux — Banner Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --wine:        #7f2457;
      --wine-dark:   #4a1030;
      --wine-deep:   #1a0d14;
      --wine-surf:   #2a1020;
      --wine-border: #5a2040;
      --wine-light:  #a83070;
      --wine-accent: #c47fa0;
      --text:        #f0d6e8;
      --text-sub:    #f5c2da;
      --text-dim:    #7a4060;
    }

    body {
      background: var(--wine-deep);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 48px 20px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ── Banner frame ─────────────────────────────────────── */
    .banner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .banner-frame {
      border: 1px solid var(--wine-border);
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 16px 56px rgba(0,0,0,0.75),
        0 0 0 1px rgba(200,80,130,0.06);
      width: 800px;
      height: 75px;
      flex-shrink: 0;
    }

    #banner { display: block; width: 800px; height: 75px; }

    .banner-size {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    /* ── Controls ─────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--wine-surf);
      border: 1px solid var(--wine-border);
      border-radius: 10px;
      padding: 14px 22px;
    }

    .controls label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--wine-accent);
      white-space: nowrap;
    }

    .version-wrapper {
      display: flex;
      align-items: center;
      background: var(--wine-deep);
      border: 1px solid var(--wine-border);
      border-radius: 6px;
      overflow: hidden;
    }

    .version-prefix {
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      background: var(--wine-surf);
      border-right: 1px solid var(--wine-border);
      user-select: none;
    }

    #version-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      width: 80px;
      padding: 8px 12px;
      caret-color: var(--wine-accent);
    }

    #version-input::placeholder {
      color: var(--wine-border);
      font-weight: 400;
      font-family: 'DM Sans', sans-serif;
    }

    .sep {
      width: 1px;
      height: 30px;
      background: var(--wine-border);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover  { opacity: .82; }
    .btn:active { transform: scale(.97); }

    .btn-svg { background: var(--wine); color: #fff; }
    .btn-png { background: var(--wine-dark); color: var(--text); border: 1px solid var(--wine-border); }
  </style>
</head>
<body>

  <p class="eyebrow">RuscaLinux — Banner Generator</p>

  <div class="banner-wrap">
    <div class="banner-frame">
      <svg
        id="banner"
        width="800" height="75"
        viewBox="0 0 800 75"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap');
          </style>

          <radialGradient id="vig" cx="50%" cy="50%" r="75%">
            <stop offset="0%"   stop-color="white"  stop-opacity="0"/>
            <stop offset="100%" stop-color="black"  stop-opacity="1"/>
          </radialGradient>

          <filter id="tshadow" x="-5%" y="-20%" width="110%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
            <feOffset dx="0" dy="1" result="blur"/>
            <feFlood flood-color="#000000" flood-opacity="0.28"/>
            <feComposite in2="blur" operator="in" result="sh"/>
            <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>

          <filter id="lshadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
            <feOffset dx="1" dy="2" result="blur"/>
            <feFlood flood-color="#000000" flood-opacity="0.22"/>
            <feComposite in2="blur" operator="in" result="sh"/>
            <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <rect width="800" height="75" fill="#7f2457"/>

        <rect width="800" height="75" fill="url(#vig)" opacity="0.18"/>

        <rect x="0" y="72" width="800" height="3" fill="#a03060" opacity="0.55"/>

        <line x1="0" y1="37.5" x2="800" y2="37.5"
              stroke="#ffffff" stroke-width="0.4" opacity="0.07"/>

        <g transform="translate(7, -3) scale(0.172)" filter="url(#lshadow)">
          <path d="M213.2,385.4c-81.2-13.6-137.1-89.8-125-171.8c10.7-72.2,71.2-127.3,144-131.2
                   c84.2-4.5,156.4,60.8,161.1,145c3.2,57.1-23.7,110.1-66.7,141.4
                   c-15.3,11.1-34.8,19.3-51.2,12.5c-15.6-6.5-19.1-26.6-11.4-39.8
                   c15.1-25.9,50.7-27.1,73.5-47.8c34.3-31.1,48.2-82.7,33-126.7
                   c-18.7-54-78.5-87.1-133.1-73.8c-55.7,13.6-94,68-85.1,124.9
                   c7,44.7,42.2,81.1,87,88.2c16.1,2.5,23.3,23.1,13.4,36.2
                   C241.6,411.3,222.8,387,213.2,385.4z" fill="#FFFFFF"/>
          <g transform="translate(325,230) rotate(-15)">
            <path d="M0,0 L35,15 L0,30 L5,15 Z" fill="#FFFFFF"/>
          </g>
        </g>

        <text
          x="415" y="26"
          font-family="'Syne', 'Arial Black', sans-serif"
          font-size="36" font-weight="800"
          fill="#FFFFFF"
          filter="url(#tshadow)"
          dominant-baseline="middle"
          text-anchor="middle"
          letter-spacing="-0.5"
        >ruscalinux</text>

        <line x1="92" y1="46.5" x2="658" y2="46.5"
              stroke="#ffffff" stroke-width="0.6" opacity="0.18"/>

        <text
          x="415" y="62"
          font-family="'Syne', Arial, sans-serif"
          font-size="12" font-weight="600"
          fill="#f5c2da"
          dominant-baseline="middle"
          text-anchor="middle"
          opacity="0.92"
        >Free, complete, and ready to go.</text>

        <g id="version-group" visibility="hidden">
          <rect id="version-pill"
                x="700" y="19" width="0" height="29"
                rx="6" fill="#4a1030" opacity="0.88"/>
          <text
            id="version-text"
            x="790" y="34"
            font-family="'Syne', Arial, sans-serif"
            font-size="17" font-weight="700"
            fill="#f5c2da"
            filter="url(#tshadow)"
            dominant-baseline="middle"
            text-anchor="end"
          ></text>
        </g>
      </svg>
    </div>
    <p class="banner-size">800 × 75 px</p>
  </div>

  <div class="controls">
    <label>Version</label>
    <div class="version-wrapper">
      <span class="version-prefix">v</span>
      <input
        id="version-input"
        type="text"
        placeholder="1.10"
        maxlength="12"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    <div class="sep"></div>
    <button class="btn btn-svg" onclick="downloadSVG()">↓ Download SVG</button>
    <button class="btn btn-png" onclick="downloadPNG()">↓ Download PNG</button>
  </div>

  <script>
    const input  = document.getElementById('version-input');
    const vGroup = document.getElementById('version-group');
    const vText  = document.getElementById('version-text');
    const vPill  = document.getElementById('version-pill');

    /* Canvas di misura per calcolare la larghezza reale del testo */
    const measCtx = document.createElement('canvas').getContext('2d');

    function measureText(str, size, weight) {
      measCtx.font = weight + ' ' + size + 'px Syne, Arial';
      return measCtx.measureText(str).width;
    }

    function updateBanner() {
      const val = input.value.trim();
      if (!val) { vGroup.setAttribute('visibility', 'hidden'); return; }

      const label = 'v' + val;
      vText.textContent = label;
      vGroup.setAttribute('visibility', 'visible');

      const tw   = measureText(label, 17, '700');
      const padX = 14;
      const pillW = Math.ceil(tw + padX * 2);
      const pillX = 792 - pillW;

      vPill.setAttribute('x',     pillX);
      vPill.setAttribute('width', pillW);
      vText.setAttribute('x',     792 - padX);

      /* Accorcia la linea divisoria per non invadere la pill */
      document.querySelector('#banner line[x1="92"]')
        ?.setAttribute('x2', String(pillX - 8));
    }

    input.addEventListener('input', updateBanner);

    /* ── Export ──────────────────────────────────────────── */

    function getInlineSVG() {
      return new XMLSerializer().serializeToString(
        document.getElementById('banner').cloneNode(true)
      );
    }

    function downloadSVG() {
      const blob = new Blob([getInlineSVG()], { type: 'image/svg+xml;charset=utf-8' });
      trigger(URL.createObjectURL(blob), 'ruscalinux-banner.svg');
    }

    function downloadPNG() {
      const svgData = getInlineSVG();
      const url = URL.createObjectURL(
        new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' })
      );
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 800; c.height = 75;
        c.getContext('2d').drawImage(img, 0, 0, 800, 75);
        URL.revokeObjectURL(url);
        c.toBlob(blob => trigger(URL.createObjectURL(blob), 'ruscalinux-banner.png'), 'image/png');
      };
      img.src = url;
    }

    function trigger(href, filename) {
      const a = Object.assign(document.createElement('a'), { href, download: filename });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(href), 2000);
    }
  </script>
</body>
</html>
